<div class="item" [attr.data-sku]="item().sku" [attr.data-price]="item().price">
  <div class="thumb">
    @if (item().image_url) {
      <img [src]="item().image_url" [alt]="item().name" class="product-img" />
    } @else {
      <svg viewBox="0 0 68 68" fill="none">
        <rect width="68" height="68" fill="#151515" />
        <rect x="10" y="24" width="48" height="20" rx="2" stroke="#d9812f" stroke-width="1.5" />
        <circle cx="20" cy="34" r="5" stroke="#8a8886" />
        <circle cx="34" cy="34" r="5" stroke="#8a8886" />
        <circle cx="48" cy="34" r="5" stroke="#8a8886" />
      </svg>
    }
  </div>
  <div class="info">
    <div class="sku">SKU · {{ item().sku }}</div>
    <div class="name">{{ item().name }}</div>
    <div class="category">{{ item().category }}</div>
  </div>
  <div class="qty">
    <button class="dec" (click)="decrement()" [disabled]="localQuantity <= 1">−</button>
    <span class="n" aria-readonly="true">{{ localQuantity }}</span>
    <button class="inc" (click)="increment()">+</button>
  </div>
  <div class="price-block">
    <div class="price">{{ (item().price * localQuantity) | currency:'PHP':'symbol':'1.2-2' }}</div>
  </div>
  <button class="remove" (click)="onRemove()">✕</button>
</div>
