@for (product of products(); track product.id) {
  <div class="product-card">
    <button class="edit-fab" title="Edit product">✎</button>
    <div class="idx">SKU · {{ product.sku }}</div>
    <div class="product-swatch">{{ product.category }}</div>
    <h3>{{ product.title }}</h3>
    <div class="p-spec"><span>Key Spec</span><b>{{ product.keySpec }}</b></div>
    <div class="p-spec"><span>Stock Qty</span><b>{{ product.stockQty }}</b></div>
    <div class="p-footer">
      <span class="p-price">{{ formatPrice(product.price) }}</span>
      <span class="p-stock" [class.ok]="!isLowStock(product)" [class.low]="isLowStock(product)">
        {{ isLowStock(product) ? 'LOW STOCK' : 'IN STOCK' }}
      </span>
    </div>
  </div>
} @empty {
  <div class="empty-note">No products yet.</div>
}
