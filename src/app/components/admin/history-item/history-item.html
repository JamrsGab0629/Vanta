<div class="table-row">
  <div class="ref-code">{{ row().reference_code }}</div>
  <div class="time-val">{{ row().order_date ? (row().order_date | date:'MMM d, y · h:mm a') : '—' }}</div>
  <div class="time-val">{{ row().delivery_date ? (row().delivery_date | date:'MMM d, y · h:mm a') : '—' }}</div>
  <div class="qty-val">{{ row().quantity }}</div>
  <div class="cash-val">{{ row().cash | currency:'PHP':'symbol':'1.2-2' }}</div>
  <div>
    <select
      class="status-select"
      [class.delivered]="row().status === 'delivered'"
      [class.transit]="row().status === 'transit'"
      [class.pending]="row().status === 'pending'"
      [value]="row().status"
      (change)="onStatusSelect($event)"
    >
      <option value="pending">pending</option>
      <option value="transit">transit</option>
      <option value="delivered">delivered</option>
    </select>
  </div>
</div>
