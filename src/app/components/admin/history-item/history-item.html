@for (order of filteredOrders(); track order.referenceCode) {
  <div class="table-row">
    <div class="ref-code">{{ order.referenceCode }}</div>
    <div class="time-val">{{ order.timeOfOrder }}</div>
    <div class="time-val">{{ order.timeOfDelivery }}</div>
    <div class="qty-val">{{ order.quantity }}</div>
    <div class="cash-val">{{ order.cash }}</div>
    <div><span [class]="'status-pill ' + order.status">{{ order.status }}</span></div>
  </div>
} @empty {
  <div class="table-row empty-row">No matching orders found.</div>
}
