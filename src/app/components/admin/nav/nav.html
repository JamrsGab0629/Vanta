<div class="sidebar">
  <div class="logo">VAN<span>TA</span></div>
  <div class="logo-tag">Admin Console</div>

  <div class="nav-group">
    <div class="nav-label">Manage</div>
    @for (panel of panels; track panel.url_suffix) {
      <a
        class="nav-item"
        [attr.data-panel]="panel.attr_name"
        [routerLink]="[panel.url_suffix]"
        routerLinkActive="active"
      >
        <span class="ic">{{ panel.symbol }}</span> {{ panel.name }}
      </a>
    }
  </div>

  <div class="sidebar-foot">
    <div class="user-info">
      <div class="avatar">{{ initials() }}</div>
      <div>
        <div class="who">{{ displayName() }}</div>
        <div class="role">ADMIN</div>
      </div>
    </div>
    
    <button type="button" class="logout-btn" (click)="logout()" title="Logout" aria-label="Logout">
      <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </button>
  </div>
</div>
