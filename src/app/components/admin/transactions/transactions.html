<div class="table-wrap">
  <div class="grid-table">
    <div class="grid-header">
      <div>Reference Code</div>
      <div>Time of Order</div>
      <div>Time of Delivery</div>
      <div>Quantity</div>
      <div>Cash</div>
      <div>Status</div>
    </div>

    @if (isLoading()) {
      <div class="empty-row">Loading orders...</div>
    } @else if (rows().length === 0) {
      <div class="empty-row">No orders found.</div>
    } @else {
      @for (row of rows(); track row.order_id) {
        <app-history-item [row]="row" (statusChange)="onStatusChange($event)"></app-history-item>
      }
    }
  </div>
</div>
