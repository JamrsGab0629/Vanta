<nav class="nav">
  <a class="logo" [routerLink]="['home']">VAN<span>TA</span></a>

  <div class="nav-user">
    @if (in_home()) {
    <a class="nav-icon" [routerLink]="['cart']">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="21" r="1" />
        <circle cx="19" cy="21" r="1" />
        <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" />
      </svg>
    </a>
    } @else {
    <a class="nav-icon" [routerLink]="['home']">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        <polyline points="9 22 9 12 15 12 15 22" />
      </svg>
    </a>
    }

    <!-- Profile Dropdown Container -->
    <div class="profile-container" (mouseenter)="isMenuOpen.set(true)" (mouseleave)="closeMenu()">
      <!-- Trigger: Name, ID, Arrow & Avatar -->
      <button class="profile-trigger" (click)="toggleMenu()" aria-label="Toggle user menu">
        <div class="who">
          <div class="name">
            <span>{{ displayName() }}</span>
            <svg class="chevron-icon" [class.rotated]="isMenuOpen()" xmlns="http://www.w3.org/2000/svg" width="10"
              height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
              stroke-linejoin="round">
              <!-- Right-pointing chevron ">" -->
              <path d="M9 5l7 7-7 7" />
            </svg>
          </div>
          <div class="id">ID: #{{ id() }}</div>
        </div>
        <div class="avatar">{{ initials() }}</div>
      </button>

      <!-- Dropdown Menu -->
      <div class="dropdown-menu" [class.open]="isMenuOpen()">
        <button class="logout-btn" (click)="logout()" title="Log out">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </div>
</nav>
