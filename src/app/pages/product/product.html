<div class="topbar">
  <div>
    <h1>Add Product</h1>
    <div class="desc">New products are bench-tested before being marked active in the database.</div>
  </div>
</div>

<div class="form-card">
  <form id="addProductForm">

    <div class="field">
      <label>Product image</label>

      @if (!imagePreviewUrl()) {
        <label
          class="image-drop"
          (drop)="onImageDrop($event)"
          (dragover)="onImageDragOver($event)"
        >
          <input type="file" accept="image/*" (change)="onImageSelected($event)" hidden>
          <span class="image-drop-icon">⇧</span>
          <span class="image-drop-text">Click to upload, or drag an image here</span>
          <span class="image-drop-hint">One image per product · JPG, PNG, or WEBP</span>
        </label>
      } @else {
        <div class="image-preview">
          <img [src]="imagePreviewUrl()" alt="Product image preview">
          <button type="button" class="image-remove" (click)="removeImage()" title="Remove image">✕</button>
        </div>
      }

      @if (imageError()) {
        <div class="field-error show">{{ imageError() }}</div>
      }
    </div>

    <div class="field-row">
      <div class="field">
        <label for="np-name">Product name</label>
        <input type="text" id="np-name" placeholder="Ridgeline RX-7800" required>
      </div>
      <div class="field">
        <label for="np-sku">SKU</label>
        <input type="text" id="np-sku" placeholder="0114-GPU" required>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="np-category">Category</label>
        <select id="np-category">
          <option>GPU</option>
          <option>CPU</option>
          <option>Storage</option>
          <option>Cooling</option>
        </select>
      </div>
      <div class="field">
        <label for="np-price">Price (PHP)</label>
        <input type="number" id="np-price" placeholder="649" required>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="np-stock">Stock quantity</label>
        <input type="number" id="np-stock" placeholder="120" required>
      </div>
      <div class="field">
        <label for="np-spec">Key spec (short)</label>
        <input type="text" id="np-spec" placeholder="16GB GDDR6 · 2,650 MHz">
      </div>
    </div>
    <div class="field">
      <label for="np-desc">Description / notes</label>
      <textarea id="np-desc" placeholder="Bench notes, thermal data, compatibility flags..."></textarea>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn-solid">ADD TO DATABASE →</button>
      <button type="reset" class="btn-outline">CLEAR</button>
    </div>
  </form>
</div>
