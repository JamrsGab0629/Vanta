<div class="topbar">
  <div>
    <h1>Product Database</h1>
    <div class="desc">Click the edit icon on any product to update its details.</div>
  </div>
  <div class="topbar-actions">
    <div class="search-box">
      <span class="ic">⌕</span>
      <input type="text" id="dbSearch" placeholder="Search products...">
    </div>
    <a class="manage-fab" routerLink="/admin/product/manage" title="Manage stock, price & delete">
      <span class="ic">✎</span>
      <span>Manage Products</span>
    </a>
  </div>
</div>

<div class="db-toolbar">
  <div class="filter-chips" id="filterChips">
    <div class="chip active" data-cat="all">All</div>
    <div class="chip" data-cat="GPU">GPU</div>
    <div class="chip" data-cat="CPU">CPU</div>
    <div class="chip" data-cat="Storage">Storage</div>
    <div class="chip" data-cat="Cooling">Cooling</div>
  </div>
</div>

<app-products></app-products>
